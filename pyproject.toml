[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "three-body-lab"
version = "0.1.0"
description = "A reproducible laboratory mapping the chaos/stability boundary of the planar gravitational three-body problem"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "David Lindgreen" }]
keywords = ["three-body-problem", "chaos", "lyapunov-exponent", "celestial-mechanics", "computational-physics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy>=1.26,<2.3", "scipy>=1.11,<2"]


[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hatchling>=1.27",
  "mypy>=1.13,<3",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
three-body-lab = "three_body_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/three_body_lab"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=three_body_lab --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["three_body_lab"]

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true
